<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жасанды интеллект және IT Startup — 11-сынып</title>
<style>
:root{--bg:#ffffff;--panel:rgba(220,38,38,.045);--panel-2:rgba(220,38,38,.09);--border:rgba(220,38,38,.16);--border-2:rgba(220,38,38,.32);--txt:#1a1a2e;--muted:#6b7280;--cyan:#ef4444;--blue:#dc2626;--purple:#991b1b;--green:#16a34a;--red:#dc2626;--yellow:#ca8a04;--grad:linear-gradient(135deg,#ef4444 0%,#dc2626 45%,#991b1b 100%);--radius:18px;--shadow:0 18px 45px -20px rgba(220,38,38,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;background:#fff;color:var(--txt);line-height:1.65;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(760px 520px at 8% -5%,rgba(239,68,68,.14),transparent 62%),radial-gradient(680px 520px at 95% 5%,rgba(220,38,38,.11),transparent 62%),radial-gradient(820px 640px at 50% 110%,rgba(239,68,68,.08),transparent 62%),#fff}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(220,38,38,.07) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);-webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%)}
::selection{background:rgba(220,38,38,.22)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#f5f5f7}
::-webkit-scrollbar-thumb{background:linear-gradient(#dc2626,#991b1b);border-radius:20px}

.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;cursor:pointer;white-space:nowrap;color:#1a1a2e}
.brand .logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-size:1.05rem;box-shadow:0 0 22px rgba(220,38,38,.45)}
.brand span.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav-links button{background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 13px;border-radius:11px;font-size:.86rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;white-space:nowrap}
.nav-links button:hover{color:#dc2626;background:var(--panel);border-color:var(--border)}
.nav-links button.active{color:#fff;background:linear-gradient(135deg,#ef4444,#991b1b);border-color:var(--border-2)}
.nav-progress{height:3px;background:rgba(220,38,38,.1);position:relative;overflow:hidden}
.nav-progress i{display:block;height:100%;width:0;background:var(--grad);transition:width .6s cubic-bezier(.4,0,.2,1)}

.wrap{max-width:1180px;margin:0 auto;padding:30px 18px 90px}
.card{background:linear-gradient(160deg,rgba(254,242,242,.7),#fff);border:1px solid var(--border);border-radius:var(--radius);padding:24px;backdrop-filter:blur(10px);box-shadow:var(--shadow);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{border-color:var(--border-2)}
.card.hoverable:hover{transform:translateY(-4px);box-shadow:0 24px 55px -22px rgba(220,38,38,.35)}
h1,h2,h3,h4{line-height:1.28;font-weight:800;color:#1a1a2e}
h1{font-size:clamp(1.6rem,3.6vw,2.5rem);letter-spacing:-.5px}
h2{font-size:clamp(1.25rem,2.4vw,1.7rem);margin-bottom:6px}
h3{font-size:1.06rem;margin-bottom:8px}
p{color:#4b5563}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.center{text-align:center}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{height:18px}
.spacer-sm{height:10px}

.btn{display:inline-flex;align-items:center;gap:9px;justify-content:center;background:var(--grad);color:#fff;border:none;border-radius:13px;padding:12px 22px;font-size:.94rem;font-weight:800;cursor:pointer;font-family:inherit;transition:.22s;box-shadow:0 12px 28px -14px rgba(220,38,38,.75)}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 34px -14px rgba(153,27,27,.85)}
.btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--border-2);box-shadow:none}
.btn.ghost:hover{background:rgba(220,38,38,.05);border-color:var(--red)}
.btn.sm{padding:8px 15px;font-size:.83rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.36);color:#991b1b;padding:5px 13px;border-radius:999px;font-size:.76rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.badge.purple{background:rgba(153,27,27,.1);border-color:rgba(153,27,27,.4);color:#7f1d1d}
.badge.cyan{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.36);color:#b91c1c}
.badge.green{background:rgba(22,163,74,.15);border-color:rgba(22,163,74,.42);color:#15803d}
.badge.red{background:rgba(220,38,38,.15);border-color:rgba(220,38,38,.42);color:#991b1b}

.hero{position:relative;overflow:hidden;border-radius:26px;border:1px solid var(--border);background:radial-gradient(700px 380px at 78% 12%,rgba(220,38,38,.15),transparent 65%),radial-gradient(600px 380px at 12% 88%,rgba(239,68,68,.11),transparent 65%),linear-gradient(150deg,rgba(254,226,226,.85),#fff);padding:clamp(28px,5vw,58px);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(220,38,38,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(220,38,38,.09) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(circle at 70% 40%,#000,transparent 72%);-webkit-mask-image:radial-gradient(circle at 70% 40%,#000,transparent 72%)}
.hero > *{position:relative;z-index:2}
.hero h1{margin:14px 0 12px;max-width:900px}
.hero p.lead{font-size:clamp(1rem,1.6vw,1.14rem);max-width:760px;color:#4b5563}
.quote{border-left:3px solid var(--red);padding:14px 18px;margin-top:22px;background:rgba(220,38,38,.06);border-radius:0 14px 14px 0;font-style:italic;color:#7f1d1d;max-width:820px}
.stat{text-align:center;padding:16px 10px;border-radius:14px;background:#fff;border:1px solid var(--border)}
.stat b{display:block;font-size:1.5rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.79rem;color:var(--muted);font-weight:600}

.topic-card{position:relative;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.topic-card .num{position:absolute;right:-8px;top:-18px;font-size:5rem;font-weight:900;color:rgba(220,38,38,.09);line-height:1;pointer-events:none}
.topic-card h3{font-size:1.02rem;max-width:88%}
.topic-card .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.pill{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(220,38,38,.06);border:1px solid var(--border);color:var(--muted)}
.pill.ok{background:rgba(22,163,74,.14);border-color:rgba(22,163,74,.4);color:#15803d}

.block{border-radius:16px;padding:18px 20px;margin-bottom:14px;background:var(--panel);border:1px solid var(--border)}
.block h3{margin-bottom:10px;display:flex;align-items:center;gap:9px;color:#1a1a2e}
.block p+p{margin-top:10px}
.block ul{margin:8px 0 0 20px;color:#4b5563}
.block li{margin-bottom:7px}
.block.remember{background:rgba(202,138,4,.08);border-color:rgba(202,138,4,.3)}
.block.remember h3{color:#a16207}
.block.example{background:rgba(220,38,38,.06);border-color:rgba(220,38,38,.26)}
.block.example h3{color:#b91c1c}
.block.conclusion{background:linear-gradient(135deg,rgba(220,38,38,.12),rgba(153,27,27,.12));border-color:rgba(153,27,27,.35)}
.block.conclusion h3{color:#991b1b}
.concept-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:6px}
.concept{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.concept b{display:block;color:var(--red);font-size:.87rem;margin-bottom:3px}
.concept span{font-size:.88rem;color:#4b5563}

.svg-box{margin:16px 0;padding:18px;background:#fff;border:1.5px solid var(--border);border-radius:16px;overflow-x:auto;box-shadow:0 6px 20px -12px rgba(220,38,38,.25)}
.svg-box h4{margin-bottom:12px;color:#991b1b;font-size:.92rem;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.4px}
.svg-box h4::before{content:"";width:5px;height:18px;background:var(--grad);border-radius:3px;display:inline-block}
.svg-box svg{width:100%;height:auto;display:block;min-width:560px}

/* AI VIDEO */
.ai-video-box{margin:20px 0;padding:20px;background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(153,27,27,.05));border:1.5px solid var(--border-2);border-radius:18px;box-shadow:0 10px 28px -14px rgba(220,38,38,.4)}
.ai-video-box h4{margin-bottom:14px;color:#991b1b;font-size:.95rem;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.4px}
.ai-video-box h4::before{content:"🤖";font-size:1.1rem}
.ai-video-player{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:14px;background:#1a1a2e;box-shadow:0 8px 24px -12px rgba(0,0,0,.5)}
.ai-video-player video{position:absolute;top:0;left:0;width:100%;height:100%;display:block;background:#000}
.ai-video-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;gap:8px}
.ai-video-fallback .icon{font-size:3rem;opacity:.5}
.ai-video-fallback b{font-size:1rem}
.ai-video-fallback small{font-size:.78rem;opacity:.7;max-width:360px}
.ai-video-box .ai-video-desc{margin-top:12px;font-size:.86rem;color:#4b5563;line-height:1.6}
.ai-video-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(22,163,74,.15);color:#15803d;border:1px solid rgba(22,163,74,.4);padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-left:auto}

.video-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.video-card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.25s;display:flex;flex-direction:column}
.video-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -18px rgba(220,38,38,.35);border-color:var(--border-2)}
.video-frame{position:relative;padding-bottom:56.25%;height:0;background:#1a1a2e;overflow:hidden}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-info{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.video-info b{font-size:.95rem;color:#1a1a2e}
.video-info span{font-size:.82rem;color:var(--muted)}
.video-info .meta{font-size:.72rem;color:#dc2626;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:auto}

.photo-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.photo-card{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:.3s;background:#f5f5f7}
.photo-card:hover{transform:scale(1.02);box-shadow:0 22px 45px -18px rgba(220,38,38,.45);border-color:var(--red)}
.photo-card img{width:100%;height:230px;object-fit:cover;display:block;transition:.4s}
.photo-card:hover img{transform:scale(1.08)}
.photo-card .caption{position:absolute;bottom:0;left:0;right:0;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:.85rem;font-weight:600;line-height:1.4}
.photo-card .caption b{display:block;font-size:.95rem;margin-bottom:2px}

.qr-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.qr-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:6px}
.qr-card:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 16px 32px -16px rgba(220,38,38,.4)}
.qr-card img{width:100%;max-width:150px;height:auto;border-radius:10px;margin-bottom:6px;background:#fff;padding:6px;border:1px solid var(--border)}
.qr-card b{display:block;font-size:.86rem;color:#991b1b;line-height:1.3}
.qr-card span{font-size:.74rem;color:var(--muted);display:block;line-height:1.3}
.qr-card a{font-size:.78rem;color:#dc2626;text-decoration:none;font-weight:700;margin-top:auto}
.qr-card a:hover{text-decoration:underline}

.qr-inline{margin:20px 0;padding:18px;background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(153,27,27,.06));border:1.5px solid var(--border);border-radius:16px}
.qr-inline h4{margin-bottom:14px;color:#991b1b;font-size:.92rem;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.4px}
.qr-inline h4::before{content:"";width:5px;height:18px;background:var(--grad);border-radius:3px;display:inline-block}
.qr-inline-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.qr-mini{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:5px}
.qr-mini:hover{border-color:var(--red);transform:translateY(-2px)}
.qr-mini img{width:100%;max-width:110px;border-radius:8px;background:#fff;padding:4px;border:1px solid var(--border)}
.qr-mini b{font-size:.76rem;color:#991b1b;line-height:1.3;display:block}
.qr-mini a{font-size:.7rem;color:#dc2626;text-decoration:none;font-weight:700}
.qr-mini a:hover{text-decoration:underline}

.media-section{margin-bottom:34px}
.media-section h2{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.media-section h2 .ico-sq{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:1.1rem;box-shadow:0 8px 18px -8px rgba(220,38,38,.7)}
.media-section > p{margin-bottom:18px;color:var(--muted)}

.tool-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tool-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;transition:.2s;display:flex;flex-direction:column;gap:6px}
.tool-card:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 14px 28px -14px rgba(220,38,38,.35)}
.tool-card .ttl{font-weight:800;color:#991b1b;font-size:.95rem;display:flex;align-items:center;gap:8px}
.tool-card .ttl .ic{width:28px;height:28px;border-radius:8px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.9rem}
.tool-card .desc{font-size:.82rem;color:#4b5563;line-height:1.5}
.tool-card a{font-size:.78rem;color:#dc2626;text-decoration:none;font-weight:700;margin-top:auto}
.tool-card a:hover{text-decoration:underline}

.task{border-radius:16px;padding:20px;margin-bottom:16px;background:linear-gradient(160deg,rgba(220,38,38,.06),rgba(255,255,255,.75));border:1px solid rgba(220,38,38,.26)}
.task-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.task-head .ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;background:var(--grad);font-size:1.05rem;color:#fff;box-shadow:0 0 20px rgba(220,38,38,.4)}
.item-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.item-row .txt{flex:1;min-width:150px;font-size:.92rem;color:#1a1a2e}
.item-row select,.item-row input[type=text]{background:#fff;border:1px solid var(--border-2);color:var(--txt);border-radius:9px;padding:8px 11px;font-family:inherit;font-size:.86rem;outline:none;min-width:150px}
.item-row select:focus,.item-row input:focus{border-color:var(--red)}
.item-row.correct{border-color:rgba(22,163,74,.6);background:rgba(22,163,74,.07)}
.item-row.wrong{border-color:rgba(220,38,38,.6);background:rgba(220,38,38,.07)}
.match-left{flex:0 0 auto;min-width:140px;font-weight:600;font-size:.9rem;color:#991b1b}
.tf-btns{display:flex;gap:8px}
.tf-btns button{background:#fff;border:1px solid var(--border-2);color:var(--txt);padding:7px 15px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:.83rem;font-weight:700;transition:.18s}
.tf-btns button:hover{border-color:var(--red)}
.tf-btns button.sel{background:linear-gradient(135deg,#ef4444,#991b1b);border-color:transparent;color:#fff}
.feedback{margin-top:10px;font-size:.88rem;font-weight:600}
.feedback.ok{color:#15803d}
.feedback.no{color:#b91c1c}
.order-num{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;background:rgba(220,38,38,.1);color:#991b1b;font-weight:800;font-size:.85rem}
.mini-btn{background:#fff;border:1px solid var(--border);color:var(--txt);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.9rem;line-height:1;transition:.18s}
.mini-btn:hover{background:rgba(220,38,38,.12);border-color:var(--red)}

.q{border-radius:15px;padding:18px;margin-bottom:14px;background:#fff;border:1px solid var(--border);transition:.25s}
.q.correct{border-color:rgba(22,163,74,.65);background:rgba(22,163,74,.06)}
.q.wrong{border-color:rgba(220,38,38,.65);background:rgba(220,38,38,.06)}
.q-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.q-num{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;background:var(--grad);color:#fff;font-weight:900;font-size:.83rem}
.q-text{font-weight:600;font-size:.96rem;flex:1;color:#1a1a2e}
.opt{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;border-radius:11px;border:1px solid var(--border);background:rgba(220,38,38,.03);margin-bottom:8px;cursor:pointer;transition:.18s;font-size:.91rem}
.opt:hover{border-color:var(--red);background:rgba(220,38,38,.07)}
.opt input{margin-top:4px;accent-color:#dc2626;width:16px;height:16px;flex:0 0 16px}
.opt input:checked ~ span{color:#1a1a2e;font-weight:600}
.explain{margin-top:10px;padding:10px 13px;border-radius:10px;font-size:.85rem;background:rgba(220,38,38,.05);border-left:3px solid var(--red);color:#4b5563}
.level{font-size:.68rem;padding:2px 8px;border-radius:999px;font-weight:800;letter-spacing:.4px}
.level.green{background:rgba(22,163,74,.18);color:#15803d;border:1px solid rgba(22,163,74,.4)}
.level.yellow{background:rgba(202,138,4,.16);color:#854d0e;border:1px solid rgba(202,138,4,.4)}
.level.red{background:rgba(220,38,38,.16);color:#991b1b;border:1px solid rgba(220,38,38,.4)}

.result{border-radius:20px;padding:26px;margin-top:20px;background:linear-gradient(150deg,rgba(239,68,68,.14),rgba(153,27,27,.12));border:1px solid var(--border-2);animation:pop .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
.score-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:18px 0}
.score-box{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.score-box b{display:block;font-size:1.35rem;color:#991b1b}
.score-box span{font-size:.76rem;color:var(--muted);font-weight:600}
.bar{height:12px;border-radius:999px;background:rgba(220,38,38,.1);overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .7s cubic-bezier(.4,0,.2,1)}

.field{margin-bottom:15px}
.field label{display:block;font-size:.85rem;font-weight:700;margin-bottom:7px;color:#374151}
.field input[type=text],.field textarea,.field select{width:100%;background:#fff;border:1px solid var(--border-2);color:var(--txt);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:.9rem;outline:none;transition:.2s;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.field textarea{min-height:88px;line-height:1.6}

.project-card{border-radius:22px;overflow:hidden;border:1px solid var(--border-2);background:linear-gradient(155deg,rgba(239,68,68,.12),rgba(153,27,27,.1));animation:pop .5s cubic-bezier(.2,1.2,.4,1)}
.project-card .pc-head{padding:26px;background:linear-gradient(135deg,rgba(239,68,68,.18),rgba(153,27,27,.16));border-bottom:1px solid var(--border)}
.project-card .pc-body{padding:24px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pc-item{background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px}
.pc-item b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--red);margin-bottom:6px}
.pc-item span{font-size:.9rem;color:#4b5563;white-space:pre-wrap}

#toast{position:fixed;right:20px;bottom:20px;z-index:999;display:flex;flex-direction:column;gap:10px}
.toast{background:linear-gradient(135deg,rgba(220,38,38,.97),rgba(153,27,27,.95));color:#fff;padding:13px 20px;border-radius:14px;font-weight:800;font-size:.88rem;box-shadow:0 16px 40px -12px rgba(220,38,38,.7);animation:slideIn .4s cubic-bezier(.2,1.2,.4,1);max-width:320px}
@keyframes slideIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}

@media (max-width:720px){
.nav-links{margin-left:0;width:100%;overflow-x:auto;padding-bottom:4px}
.nav-links button{font-size:.8rem;padding:7px 11px}
.wrap{padding:20px 13px 80px}
.card{padding:18px;border-radius:15px}
.hero{padding:26px 20px;border-radius:20px}
.match-left{min-width:100%}
.item-row select{width:100%}
.photo-card img{height:180px}
.qr-card img{max-width:120px}
.qr-mini img{max-width:90px}
}

/* ============== STATE ============== */
const LS_KEY = "ai_startup_kz_v3";
let state = loadState();
function defaultState(){ return { topics:{}, generalTest:null, project:{}, reflection:{}, builders:{} }; }
function loadState(){ try{ const raw = localStorage.getItem(LS_KEY); if(!raw) return defaultState(); return Object.assign(defaultState(), JSON.parse(raw)); }catch(e){ return defaultState(); } }
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function tState(id){ if(!state.topics[id]) state.topics[id] = {theory:false, tasks:{}, test:null}; return state.topics[id]; }
function isTopicDone(id){ const t = TOPICS.find(x=>x.id===id); if(!t) return false; const s = tState(id); return !!(s.theory && t.tasks.every((_,i)=>s.tasks[i]) && s.test); }
function isProjectComplete(){ const need = ["name","problem","relevance","solution","ai","ml","audience","mvp","marketing","ad","advantage","future"]; return need.every(k => state.project[k] && state.project[k].trim().length>0); }
function progressPercent(){
  let done = 0, total = 0;
  TOPICS.forEach(t=>{ const s = tState(t.id); total += 3; if(s.theory) done++; if(t.tasks.every((_,i)=>s.tasks[i])) done++; if(s.test) done++; });
  total += 2; if(state.generalTest) done++; if(isProjectComplete()) done++;
  total += 1; if(state.reflection && state.reflection.q1) done++;
  return Math.round(done/total*100);
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function grade(p){ if(p>=90) return {g:5, txt:"Өте жақсы"}; if(p>=70) return {g:4, txt:"Жақсы"}; if(p>=50) return {g:3, txt:"Қанағаттанарлық"}; return {g:2, txt:"Қайталау қажет"}; }
function toast(msg){ const box = document.getElementById("toast"); const d = document.createElement("div"); d.className = "toast"; d.innerHTML = msg; box.appendChild(d); setTimeout(()=>{ d.style.opacity="0"; d.style.transform="translateX(60px)"; d.style.transition=".4s"; },2600); setTimeout(()=>d.remove(),3100); }
function updateNavBar(){ document.getElementById("navBar").style.width = progressPercent() + "%"; }

/* ============== ТЕСТ ============== */
function questionHTML(q, i, prefix){
  const name = prefix + "q" + i;
  let body = "";
  if(q.type === "single" || q.type === "multi"){
    const inputType = q.type === "single" ? "radio" : "checkbox";
    body = q.options.map((o,j)=>'<label class="opt"><input type="'+inputType+'" name="'+name+'" value="'+j+'"><span>'+esc(o)+'</span></label>').join("");
  }
  else if(q.type === "tf"){
    body = '<label class="opt"><input type="radio" name="'+name+'" value="true"><span>✅ Дұрыс</span></label>' + '<label class="opt"><input type="radio" name="'+name+'" value="false"><span>❌ Бұрыс</span></label>';
  }
  else if(q.type === "match"){
    if(!q._order) q._order = shuffle(q.pairs.map((p,j)=>j));
    body = q.pairs.map((p,j)=>'<div class="item-row"><span class="match-left">'+esc(p[0])+'</span><select name="'+name+'-'+j+'"><option value="">— таңдаңыз —</option>'+q._order.map(k=>'<option value="'+k+'">'+esc(q.pairs[k][1])+'</option>').join("")+'</select></div>').join("");
  }
  const lvlBadge = q.lvl ? '<span class="level '+q.lvl+'">'+(q.lvl==="green"?"🟢 жеңіл":q.lvl==="yellow"?"🟡 орташа":"🔴 күрделі")+'</span>' : "";
  return '<div class="q" data-q="'+i+'"><div class="q-head"><div class="q-num">'+(i+1)+'</div><div class="q-text">'+esc(q.q||q.question||"")+' '+lvlBadge+'</div></div>'+body+'<div class="explain" style="display:none"></div></div>';
}

function evaluateTest(qs, prefix, root, resultBox, onDone){
  let score = 0;
  const wrongTopics = {};
  qs.forEach((q,i)=>{
    const name = prefix + "q" + i;
    const qEl = root.querySelector('[data-q="'+i+'"]');
    if(!qEl) return;
    let ok = false, correctTxt = "";
    if(q.type === "single"){ const sel = root.querySelector('input[name="'+name+'"]:checked'); if(sel) ok = (+sel.value === q.answer); correctTxt = q.options[q.answer]; }
    else if(q.type === "multi"){ const sel = Array.from(root.querySelectorAll('input[name="'+name+'"]:checked')).map(x=>+x.value).sort(); const ans = q.answer.slice().sort(); ok = sel.length === ans.length && sel.every((v,k)=>v===ans[k]); correctTxt = q.answer.map(v=>q.options[v]).join("; "); }
    else if(q.type === "tf"){ const sel = root.querySelector('input[name="'+name+'"]:checked'); if(sel) ok = ((sel.value==="true") === q.answer); correctTxt = q.answer ? "Дұрыс" : "Бұрыс"; }
    else if(q.type === "match"){ ok = q.pairs.every((p,j)=>{ const s = root.querySelector('select[name="'+name+'-'+j+'"]'); return s && s.value !== "" && (+s.value === j); }); correctTxt = q.pairs.map(p=>p[0]+" → "+p[1]).join("; "); }
    if(ok) score++;
    else if(q.topic) wrongTopics[q.topic] = (wrongTopics[q.topic]||0) + 1;
    qEl.classList.add(ok ? "correct" : "wrong");
    const ex = qEl.querySelector(".explain");
    if(ex){ ex.style.display = "block"; ex.innerHTML = (ok ? "✅ <b>Дұрыс!</b> " : "❌ <b>Қате.</b> Дұрыс жауап: <b>" + esc(correctTxt) + "</b><br>") + (q.e ? "ℹ️ " + esc(q.e) : ""); }
    qEl.querySelectorAll("input,select").forEach(el=>el.disabled = true);
  });
  const total = qs.length;
  const percent = Math.round(score/total*100);
  const gr = grade(percent);
  let weakHtml = "";
  const weak = Object.entries(wrongTopics).sort((a,b)=>b[1]-a[1]);
  if(weak.length){ weakHtml = '<div style="margin-top:14px"><b>Қайталап оқу керек тақырыптар:</b><div class="row" style="margin-top:8px">' + weak.map(w=>'<span class="badge red">'+esc(w[0])+' · '+w[1]+' қате</span>').join("") + '</div></div>'; }
  else { weakHtml = '<div style="margin-top:14px" class="badge green">🎉 Қате жоқ — тамаша нәтиже!</div>'; }
  resultBox.innerHTML = '<div class="result"><div class="badge purple">Тест нәтижесі</div><div class="score-grid"><div class="score-box"><b>'+score+'/'+total+'</b><span>ДҰРЫС ЖАУАП</span></div><div class="score-box"><b>'+(total-score)+'</b><span>ҚАТЕ ЖАУАП</span></div><div class="score-box"><b>'+percent+'%</b><span>ПАЙЫЗДЫҚ</span></div><div class="score-box"><b>'+gr.g+'</b><span>БАҒА</span></div></div><p style="font-size:1.05rem"><b>Сіздің нәтижеңіз: '+score+'/'+total+'</b> · Баға: <b>'+gr.g+'</b> — '+gr.txt+'</p>'+weakHtml+'</div>';

}

function taskHTML(task, ti, topicId){
  let inner = "";
  if(task.type === "sort"){ inner = task.items.map((it,i)=>'<div class="item-row" data-si="'+i+'"><span class="txt">'+esc(it.text)+'</span><select data-sel="'+i+'"><option value="">— таңдаңыз —</option>'+task.buckets.map((b,j)=>'<option value="'+j+'">'+esc(b)+'</option>').join("")+'</select></div>').join(""); }
  else if(task.type === "match"){ if(!task._order) task._order = shuffle(task.pairs.map((p,j)=>j)); inner = task.pairs.map((p,j)=>'<div class="item-row" data-mi="'+j+'"><span class="match-left">'+esc(p[0])+'</span><select data-msel="'+j+'"><option value="">— таңдаңыз —</option>'+task._order.map(k=>'<option value="'+k+'">'+esc(task.pairs[k][1])+'</option>').join("")+'</select></div>').join(""); }
  else if(task.type === "tf"){ inner = task.items.map((it,i)=>'<div class="item-row" data-tfi="'+i+'"><span class="txt">'+esc(it.text)+'</span><div class="tf-btns"><button type="button" data-tf="true" data-i="'+i+'">Дұрыс</button><button type="button" data-tf="false" data-i="'+i+'">Бұрыс</button></div></div>').join(""); }
  else if(task.type === "order"){ if(!task._state) task._state = shuffle(task.items.map((_,i)=>i)); inner = '<div data-order-list="'+ti+'">' + task._state.map((origIdx, pos)=>'<div class="item-row" data-oi="'+pos+'"><span class="order-num">'+(pos+1)+'</span><span class="txt">'+esc(task.items[origIdx])+'</span><button type="button" class="mini-btn" data-move="up" data-pos="'+pos+'">▲</button><button type="button" class="mini-btn" data-move="down" data-pos="'+pos+'">▼</button></div>').join("") + '</div>'; }
  else if(task.type === "single"){ inner = '<p style="color:#4b5563;margin-bottom:12px;padding:12px 14px;background:rgba(220,38,38,.05);border-radius:12px;border-left:3px solid #dc2626">' + esc(task.scenario) + '</p>' + task.options.map((o,j)=>'<label class="opt"><input type="radio" name="task_'+topicId+'_'+ti+'" value="'+j+'"><span>'+esc(o)+'</span></label>').join(""); }
  else if(task.type === "builder"){ inner = task.fields.map(f=>{ let input = ""; if(f.type === "textarea") input = '<textarea data-bf="'+f.id+'" placeholder="'+esc(f.ph||"")+'"></textarea>'; else if(f.type === "select") input = '<select data-bf="'+f.id+'"><option value="">— таңдаңыз —</option>' + f.options.map(o=>'<option>'+esc(o)+'</option>').join("") + '</select>'; else input = '<input type="text" data-bf="'+f.id+'" placeholder="'+esc(f.ph||"")+'">'; return '<div class="field"><label>'+esc(f.label)+'</label>'+input+'</div>'; }).join(""); }
  return '<div class="task" data-task="'+ti+'"><div class="task-head"><div class="ico">'+(task.icon||"✏️")+'</div><div><h3>'+esc(task.title)+'</h3><p class="small muted">'+esc(task.instruction)+'</p></div></div>'+inner+'<div class="spacer-sm"></div><button class="btn sm" data-check="'+ti+'">✔ Тексеру</button> <div class="feedback" data-fb="'+ti+'"></div><div data-bres="'+ti+'"></div></div>';
}

function bindTasks(root, topicId){
  const topic = TOPICS.find(t=>t.id===topicId);
  root.querySelectorAll("[data-tf]").forEach(btn=>{ btn.addEventListener("click", ()=>{ const i = +btn.dataset.i; const wrap = root.querySelector('[data-tfi="'+i+'"]'); wrap.querySelectorAll("[data-tf]").forEach(b=>b.classList.remove("sel")); btn.classList.add("sel"); }); });
  root.querySelectorAll("[data-move]").forEach(btn=>{ btn.addEventListener("click", ()=>{ const pos = +btn.dataset.pos; const dir = btn.dataset.move; const list = btn.closest('[data-order-list]'); const ti = +list.dataset.orderList; const st = topic.tasks[ti]._state; const np = dir === "up" ? pos-1 : pos+1; if(np < 0 || np >= st.length) return; [st[pos], st[np]] = [st[np], st[pos]]; renderTopicView(topicId, true); }); });
  root.querySelectorAll("[data-check]").forEach(btn=>{ btn.addEventListener("click", ()=>{ checkTask(root, topic, +btn.dataset.check, topicId); }); });
  root.querySelectorAll("[data-bf]").forEach(inp=>{ inp.addEventListener("input", ()=>{ const ti = +inp.closest("[data-task]").dataset.task; const key = "t"+topicId+"_task"+ti; if(!state.builders[key]) state.builders[key] = {}; state.builders[key][inp.dataset.bf] = inp.value; saveState(); }); const key = "t"+topicId+"_task"+ (+inp.closest("[data-task]").dataset.task); const saved = (state.builders[key]||{})[inp.dataset.bf]; if(saved) inp.value = saved; });
}

function checkTask(root, topic, ti, topicId){
  const task = topic.tasks[ti];
  const tEl = root.querySelector('[data-task="'+ti+'"]');
  const fb = tEl.querySelector('[data-fb="'+ti+'"]');
  let ok = false;
  if(task.type === "sort"){ let right = 0; task.items.forEach((it,i)=>{ const row = tEl.querySelector('[data-si="'+i+'"]'); const sel = tEl.querySelector('[data-sel="'+i+'"]'); const good = sel.value !== "" && (+sel.value === it.b); row.classList.toggle("correct", good); row.classList.toggle("wrong", !good); if(good) right++; }); ok = right === task.items.length; fb.className = "feedback " + (ok?"ok":"no"); fb.textContent = ok ? "✅ Барлығы дұрыс! ("+right+"/"+task.items.length+")" : "Дұрыс жауаптар: "+right+"/"+task.items.length+". Қателерді түзетіп, қайта тексеріңіз."; }
  else if(task.type === "match"){ let right = 0; task.pairs.forEach((p,j)=>{ const row = tEl.querySelector('[data-mi="'+j+'"]'); const sel = tEl.querySelector('[data-msel="'+j+'"]'); const good = sel.value !== "" && (+sel.value === j); row.classList.toggle("correct", good); row.classList.toggle("wrong", !good); if(good) right++; }); ok = right === task.pairs.length; fb.className = "feedback " + (ok?"ok":"no"); fb.textContent = ok ? "✅ Барлық жұп дұрыс!" : "Дұрыс жұптар: "+right+"/"+task.pairs.length; }
  else if(task.type === "tf"){ let right = 0; task.items.forEach((it,i)=>{ const row = tEl.querySelector('[data-tfi="'+i+'"]'); const sel = row.querySelector("[data-tf].sel"); if(!sel){ row.classList.add("wrong"); return; } const good = (sel.dataset.tf === "true") === it.a; row.classList.toggle("correct", good); row.classList.toggle("wrong", !good); if(good) right++; }); ok = right === task.items.length; fb.className = "feedback " + (ok?"ok":"no"); fb.innerHTML = ok ? "✅ Барлығы дұрыс!" : "Дұрыс: "+right+"/"+task.items.length+"<br><span class='muted'>" + task.items.map((it,i)=> (i+1)+") "+(it.a?"Дұрыс":"Бұрыс")+" — "+esc(it.e)).join("<br>") + "</span>"; }
  else if(task.type === "order"){ const st = task._state; ok = st.every((orig,pos)=>orig === pos); fb.className = "feedback " + (ok?"ok":"no"); fb.textContent = ok ? "✅ Реті дұрыс!" : "❌ Реті қате. ▲▼ батырмалары арқылы түзетіңіз."; tEl.querySelectorAll("[data-oi]").forEach(row=>{ const pos = +row.dataset.oi; row.classList.toggle("correct", st[pos]===pos); row.classList.toggle("wrong", st[pos]!==pos); }); }
  else if(task.type === "single"){ const sel = tEl.querySelector('input[type=radio]:checked'); if(!sel){ fb.className="feedback no"; fb.textContent="Жауап таңдаңыз."; return; } ok = (+sel.value === task.answer); fb.className = "feedback " + (ok?"ok":"no"); fb.innerHTML = ok ? "✅ Дұрыс! " + esc(task.explain) : "❌ Қате. " + esc(task.explain); tEl.querySelectorAll(".opt").forEach(o=>{ const inp = o.querySelector("input"); if(+inp.value === task.answer) o.style.borderColor = "rgba(22,163,74,.7)"; else if(inp.checked) o.style.borderColor = "rgba(220,38,38,.7)"; }); }
  else if(task.type === "builder"){ const key = "t"+topicId+"_task"+ti; const data = state.builders[key] || {}; const filled = task.fields.every(f => (data[f.id]||"").trim().length>0); if(!filled){ fb.className = "feedback no"; fb.textContent = "Барлық өрісті толтырыңыз."; return; } ok = true; fb.className = "feedback ok"; fb.textContent = "✅ " + task.resultTitle + " дайын!"; const box = tEl.querySelector('[data-bres="'+ti+'"]'); box.innerHTML = '<div class="project-card" style="margin-top:14px"><div class="pc-head"><h2>'+esc(task.resultTitle)+'</h2></div><div class="pc-body">' + task.fields.map(f=>'<div class="pc-item"><b>'+esc(f.label.replace(/^\d+\.\s*/,""))+'</b><span>'+esc(data[f.id])+'</span></div>').join("") + '</div></div>'; }
  const st = tState(topicId);
  if(ok){ st.tasks[ti] = true; saveState(); }
}

function go(view, param){
  document.querySelectorAll("#navLinks button").forEach(b=>{ b.classList.toggle("active", b.dataset.nav === view || (view==="topic" && b.dataset.nav==="topics")); });
  const app = document.getElementById("app");
  if(view==="home") app.innerHTML = viewHome();
  else if(view==="topics") app.innerHTML = viewTopics();
  else if(view==="topic"){ renderTopicView(param); return; }
  else if(view==="media") app.innerHTML = viewMedia();
  else if(view==="general") app.innerHTML = viewGeneral();
  else if(view==="project") app.innerHTML = viewProject();
  else if(view==="conclusion") app.innerHTML = viewConclusion();
  if(view==="general") bindGeneral();
  if(view==="project") bindProject();
  if(view==="conclusion") bindReflection();
  updateNavBar();
  window.scrollTo({top:0});
}

    '</div>' +
    aiVideoBlock(t) +
    '<div class="card" style="margin-bottom:18px">' +
      '<div class="row" style="margin-bottom:12px">' +
        '<h2 style="margin:0">📖 Теориялық бөлім</h2>' +
        '<span class="badge cyan" style="margin-left:auto">Схемалар + Фото + QR</span>' +
      '</div>' +
      theoryHTML +
      qrHTML +
    '</div>' +
    '<div class="card" style="margin-bottom:18px">' +
      '<h2>✏️ Интерактивті тапсырмалар</h2>' +
      '<p class="muted small">Әр тапсырманы орындап, «Тексеру» батырмасын бас. Нәтиже автоматты сақталады.</p>' +
      '<div class="spacer-sm"></div>' +
      t.tasks.map((task,ti)=>taskHTML(task, ti, id)).join("") +
    '</div>' +
    '<div class="card" style="margin-bottom:18px">' +
      '<h2>📝 Өзін-өзі тексеру тесті</h2>' +
      '<p class="muted small">'+t.test.length+' сұрақ. Тест автоматты тексеріледі.</p>' +
      '<div class="spacer-sm"></div>' +
      '<div id="topicTest">' + t.test.map((q,i)=>questionHTML(q,i,"t"+id+"_")).join("") + '</div>' +
      '<div class="spacer-sm"></div>' +
      '<button class="btn" id="topicTestBtn">✅ Тестті аяқтау</button>' +
      '<div id="topicTestResult"></div>' +
    '</div>' +
    '<div class="card row" style="justify-content:space-between">' +
      (prev ? '<button class="btn ghost" onclick="go(\'topic\','+prev+')">← '+prev+'-тақырып</button>' : '<span></span>') +
      (next ? '<button class="btn" onclick="go(\'topic\','+next+')">Келесі тақырыпқа өту →</button>' : '<button class="btn" onclick="go(\'general\')">🎯 Жалпы тестке өту →</button>') +
    '</div>';

  tState(id).theory = true;
  saveState();

  // AI video fallback — if video fails or empty
  const vEl = document.querySelector('.ai-video-box video');
  if(vEl){
    const srcEl = vEl.querySelector('source');
    const fbEl = document.getElementById('aiFb-'+id);
    const showFb = ()=>{ if(fbEl) fbEl.style.display = 'flex'; };
    const hideFb = ()=>{ if(fbEl) fbEl.style.display = 'none'; };
    vEl.addEventListener('loadeddata', hideFb);
    vEl.addEventListener('error', showFb);
    srcEl && srcEl.addEventListener('error', showFb);
    // Show fallback by default (until video loads)
    showFb();
  }

  bindTasks(app, id);
  const testBtn = document.getElementById("topicTestBtn");
  const resBox = document.getElementById("topicTestResult");
  const testRoot = document.getElementById("topicTest");

  if(s.test){
    testBtn.disabled = true;
    testBtn.textContent = "Тест тапсырылды ✓";
    resBox.innerHTML = '<div class="result"><div class="badge green">Аяқталды</div><p style="margin-top:10px">Сіздің нәтижеңіз: <b>'+s.test.score+'/'+s.test.total+'</b> · '+s.test.percent+'% · Баға: <b>'+grade(s.test.percent).g+'</b></p><button class="btn ghost sm" id="retakeBtn" style="margin-top:10px">🔄 Қайта тапсыру</button></div>';
    const rb = document.getElementById("retakeBtn");
    if(rb) rb.addEventListener("click", ()=>{ tState(id).test = null; saveState(); renderTopicView(id); });
  } else {
    testBtn.addEventListener("click", ()=>{
      evaluateTest(t.test, "t"+id+"_", testRoot, resBox, (score,total,percent)=>{
        tState(id).test = {score, total, percent};
        saveState();
        testBtn.disabled = true;
        testBtn.textContent = "Тест тапсырылды ✓";
        const rb = document.getElementById("retakeBtn");
        if(rb) rb.addEventListener("click", ()=>{ tState(id).test = null; saveState(); renderTopicView(id); });
      });
    });
  }
  updateNavBar();
  if(!keepScroll) window.scrollTo({top:0});
}

function resetGeneral(){ state.generalTest = null; saveState(); go("general"); }
function bindGeneral(){
  const btn = document.getElementById("genBtn");
  const box = document.getElementById("genResult");
  const root = document.getElementById("genTest");
  if(!btn) return;
  if(state.generalTest){ btn.disabled = true; btn.textContent = "Тест тапсырылды ✓"; }
  btn.addEventListener("click", ()=>{
    evaluateTest(GENERAL_TEST, "g_", root, box, (score,total,percent)=>{
      const gr = grade(percent);
      state.generalTest = {score, total, percent, grade:gr.g};
      saveState();
      btn.disabled = true; btn.textContent = "Тест тапсырылды ✓";
    });
  });
}
